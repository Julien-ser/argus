# Explicit rule selection.
#
# CI installs ruff unpinned (`pip install ... ruff`). Ruff's default rule set
# widened between releases, so a build that passed in May failed in August
# without a line of code changing — 74 errors, none of them real defects. Two
# of the newly-default groups actively fight this codebase:
#
#   B008  flags `Depends(get_session)` in a parameter default, which is the
#         documented FastAPI idiom, not a bug.
#   UP045 wants `Optional[X]` rewritten to `X | None` in SQLModel field
#         annotations, which SQLModel/Pydantic resolve differently at runtime.
#
# Pinning the selection keeps "lint" meaning the same thing across ruff
# versions. E4/E7/E9 + F are ruff's historical defaults; I (isort) is added
# deliberately so import order stays tidy.
target-version = "py310"
line-length = 110

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.isort]
known-first-party = ["aql", "database", "ingest", "models", "suggest", "transcript", "trust"]
